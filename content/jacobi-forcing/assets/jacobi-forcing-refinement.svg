<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Jacobi Forcing improves several guesses together</title>
<desc>A made-up sentence improves through several rounds. Some later words match the finished sentence while earlier words are still changing. Words stand in for tokens.</desc>
<rect width="1600" height="900" fill="#f7f5ef"/>
<text x="96" y="154" font-family="Helvetica, Arial, sans-serif" font-size="66" font-weight="700" text-anchor="start" fill="#252523">Parallel token refinement</text>
<rect x="96" y="253" width="24" height="24" rx="5" fill="#315ad4"/>
<text x="134" y="273" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#252523">Matches the finished sentence</text>
<rect x="575" y="253" width="24" height="24" rx="5" fill="#e5e3dc" stroke="#cccac3"/>
<text x="613" y="273" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#252523">Still needs to change</text>
<text x="96" y="406" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="600" text-anchor="start" fill="#252523">First guesses</text>
<rect x="405" y="353" width="155" height="88" rx="10" fill="#e5e3dc" stroke="#d4d2ca"/>
<text x="482.5" y="409" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="500" text-anchor="middle" fill="#74746c">A</text>
