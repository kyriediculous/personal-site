<text x="1377.5" y="409" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="500" text-anchor="middle" fill="#74746c">tree</text>
<line x1="285" y1="432" x2="285" y2="475" stroke="#a4a39b" stroke-width="2"/>
