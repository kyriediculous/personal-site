<text x="661.5" y="409" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="500" text-anchor="middle" fill="#74746c">dog</text>
<rect x="763" y="353" width="155" height="88" rx="10" fill="#e5e3dc" stroke="#d4d2ca"/>
<text x="840.5" y="409" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="500" text-anchor="middle" fill="#74746c">ran</text>
<rect x="942" y="353" width="155" height="88" rx="10" fill="#e5e3dc" stroke="#d4d2ca"/>
<text x="1019.5" y="409" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="500" text-anchor="middle" fill="#74746c">near</text>
